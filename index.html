<!doctype html>
<html lang="fr" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Felipe Portugal · Développeur logiciel polyvalent</title>
    <meta
      name="description"
      content="Portfolio de Felipe Portugal, étudiant en génie logiciel à l’ÉTS, à Montréal : applications mobiles, backend, données et robotique."
    />
    <meta name="author" content="Felipe Portugal" />
    <link rel="canonical" href="https://felipe-portugal.github.io/obsidian-glass/" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0b0d10" />
    <meta property="og:type" content="profile" />
    <meta property="og:url" content="https://felipe-portugal.github.io/obsidian-glass/" />
    <meta property="og:title" content="Felipe Portugal · Développeur logiciel polyvalent" />
    <meta
      property="og:description"
      content="Portfolio de Felipe Portugal, étudiant en génie logiciel à l’ÉTS, à Montréal : applications mobiles, backend, données et robotique."
    />
    <meta property="og:locale" content="fr_CA" />
    <meta property="og:locale:alternate" content="en_CA" />
    <meta property="profile:first_name" content="Felipe" />
    <meta property="profile:last_name" content="Portugal" />
    <meta property="og:image" content="https://felipe-portugal.github.io/obsidian-glass/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Felipe Portugal, développeur logiciel polyvalent : applications mobiles, backend, données et robotique."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      (function () {
        var root = document.documentElement
        var get = function (key) {
          try {
            return window.localStorage.getItem(key)
          } catch (error) {
            return null
          }
        }
        var theme = get('og-theme')
        var dark =
          theme === 'dark' ||
          (theme !== 'light' && !!window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
        root.setAttribute('data-theme', dark ? 'dark' : 'light')
        root.style.colorScheme = dark ? 'dark' : 'light'
        var lang = get('og-lang')
        if (lang !== 'fr' && lang !== 'en') {
          lang = 'fr'
          var prefs = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || '']
          for (var i = 0; i < prefs.length; i++) {
            var code = String(prefs[i]).toLowerCase()
            if (code.indexOf('fr') === 0) break
            if (code.indexOf('en') === 0) {
              lang = 'en'
              break
            }
          }
        }
        root.setAttribute('lang', lang)
        // JavaScript actif : la version statique pré-rendue cède la place à l'application.
        root.classList.add('js')
      })()
    </script>
  </head>
  <body>
    <div id="root"><!--prerender--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
