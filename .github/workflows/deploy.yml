# Publication sur GitHub Pages.
# Publication à chaque push sur main, avec lancement manuel possible depuis Actions.
name: Publier sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Aucun droit par défaut : chaque tâche reçoit seulement ce dont elle a besoin.
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # Fournit le chemin de base : « /<dépôt> » pour un site de projet, vide pour un site
      # utilisateur (<compte>.github.io) ou un domaine personnalisé.
      - id: pages
        uses: actions/configure-pages@v6

      - run: npm ci

      # Typecheck, lint, tests et build : une seule commande, la même qu'en local.
      - run: npm run check
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # Identifiant public du formulaire Formspree (variable de dépôt, pas un secret).
          # Absent : le site propose le courriel direct et l'indique honnêtement.
          VITE_FORMSPREE_ID: ${{ vars.VITE_FORMSPREE_ID }}

      # Bout en bout dans Chrome sur le build obtenu : adresses des études de cas et repli
      # sur la version statique si JavaScript échoue. Un échec bloque la publication.
      - run: npm run test:e2e
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
